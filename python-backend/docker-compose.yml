version: '3.8'

services:
  medical-chatbot-backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama2
    depends_on:
      - ollama
    networks:
      - chatbot-network

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - chatbot-network
    command: ["ollama", "serve"]

volumes:
  ollama_data:

networks:
  chatbot-network:
    driver: bridge